<div class="login-container">
    <div class="login-card">
      <h2>Patient Management System</h2>
      <h3>Login</h3>
      <form (ngSubmit)="login()">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" [(ngModel)]="loginData.email" placeholder="Enter Email" required/>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" [(ngModel)]="loginData.password" placeholder="Enter Password" required/>
        </div>
        <button type="submit">Login</button>
         @if (errorMessage) {
        <p class="error">
          {{ errorMessage }}
        </p>
      }
      </form>
    </div>
</div>
